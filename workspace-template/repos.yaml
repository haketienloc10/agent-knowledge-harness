# Registry các Git repository local do QiQi điều phối.
# `path` tính tương đối từ workspace root, có thể dùng `..` cho repo sibling,
# và phải resolve tới đúng Git root. Không dùng absolute path.

workspace:
  name: "{{WORKSPACE_NAME}}"

repositories:
  - name: "{{MODULE_1}}"
    path: "{{MODULE_1_PATH}}"
    role: "{{MODULE_1_ROLE}}"
    required_for:
      - "{{PRIMARY_WORKFLOW}}"
    depends_on:
      - "{{DEPENDENCY_MODULE}}"

  - name: "{{MODULE_2}}"
    path: "{{MODULE_2_PATH}}"
    role: "{{MODULE_2_ROLE}}"
    required_for:
      - "{{PRIMARY_WORKFLOW}}"
    depends_on: []
