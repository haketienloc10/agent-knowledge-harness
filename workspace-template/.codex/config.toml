[mcp_servers.qiqi_delegate]
command = "bash"
args = ["scripts/qiqi-mcp-server.sh"]
startup_timeout_sec = 30
tool_timeout_sec = 7200
required = true
enabled_tools = ["delegate_repo_task", "start_graph", "get_graph", "get_node_review", "get_node_reviews", "delegate_next", "submit_decisions", "reconcile_graph"]
default_tools_approval_mode = "approve"

[features.code_mode]
direct_only_tool_namespaces = ["mcp__qiqi_delegate"]
