[mcp_servers.qiqi_delegate]
command = "bash"
args = ["scripts/qiqi-mcp-server.sh"]
startup_timeout_sec = 30
tool_timeout_sec = 7200
required = true
enabled_tools = ["delegate_repo_task", "record_lead_disposition", "record_work_item_revision", "record_peer_signal", "record_peer_signal_resolution", "record_candidate_reconciliation", "record_dependency_consumed", "record_dependency_consumption_resolution", "release_write_scope_claim", "get_turn_capture_review", "start_graph", "get_graph", "get_node_review", "get_node_reviews", "delegate_next", "submit_decisions", "reconcile_graph"]
default_tools_approval_mode = "approve"

[features.code_mode]
direct_only_tool_namespaces = ["mcp__qiqi_delegate"]
