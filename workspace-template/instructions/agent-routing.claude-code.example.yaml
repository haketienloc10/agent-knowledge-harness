# Mẫu registry chỉ dùng Claude Code cho qiqi_delegate.
# MCP chạy Claude interactive bên trong Herdr; QiQi chỉ chọn route.
version: 1

agents:
  claude:
    command: claude
    adapter: claude

    start_args:
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    resume_args:
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

routes:
  claude-haiku:
    agent: claude
    model: haiku
    args:
      - --permission-mode
      - acceptEdits
      - --effort
      - medium

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
