# Canonical machine-readable runtime routing registry for qiqi_delegate.
# This is the only file under instructions/ loaded by the MCP server.
#
# QiQi owns task semantics, route selection, and START vs RESUME.
# This registry owns only executable/adapter/model/native CLI arguments.
# qiqi_delegate owns the native result-capture hook and injects it through the
# {handoff_args} placeholder on every START/RESUME invocation.
#
# Do not put result paths, result schemas, hook commands, or handoff persistence
# mechanics in this file. {handoff_args} must appear exactly once in both the
# START and RESUME templates for every agent.
#
# Scalar placeholders: {model}, {session_id}.
# List placeholders: {route_args}, {handoff_args}.

version: 2

agents:
  codex:
    command: codex
    adapter: codex

    start_args:
      - "{handoff_args}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - "{route_args}"

    # Codex -c session config overrides are top-level options, so both
    # route_args and handoff_args intentionally precede the resume subcommand.
    resume_args:
      - "{route_args}"
      - "{handoff_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"

  claude:
    command: claude
    adapter: claude

    start_args:
      - "{handoff_args}"
      - --model
      - "{model}"
      - "{route_args}"

    resume_args:
      - "{handoff_args}"
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  claude-haiku:
    agent: claude
    model: haiku
    args:
      - --permission-mode
      - acceptEdits
      - --effort
      - medium

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
