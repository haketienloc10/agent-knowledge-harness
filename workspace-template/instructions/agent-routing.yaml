# Machine-readable execution registry for qiqi_delegate.
# QiQi selects a route. The MCP server owns CLI construction, START/RESUME,
# native session-id extraction, result normalization and serialization.
# Flags belong here, not in QiQi prompts or MCP tool arguments.
#
# Agent-level args must be valid for every model using that agent. Put flags
# whose support varies by model (for example Claude permission modes) in the
# route's args instead.

version: 1

agents:
  codex:
    command: codex
    adapter: codex
    prompt_transport: stdin
    prompt_arg: "-"

    # {route_args} expands to the selected route's args list.
    # Other supported placeholders: {model}, {session_id}, {schema_path},
    # {result_path}.
    start_args:
      - exec
      - --dangerously-bypass-approvals-and-sandbox
      - --json
      - --ignore-user-config
      - --model
      - "{model}"
      - "{route_args}"
      - --output-schema
      - "{schema_path}"
      - --output-last-message
      - "{result_path}"

    resume_args:
      - exec
      - --dangerously-bypass-approvals-and-sandbox
      - --json
      - --ignore-user-config
      - --model
      - "{model}"
      - "{route_args}"
      - --output-schema
      - "{schema_path}"
      - --output-last-message
      - "{result_path}"
      - resume
      - "{session_id}"

  claude:
    command: claude
    adapter: claude
    prompt_transport: argument

    start_args:
      - -p
      - --output-format
      - json
      - --model
      - "{model}"
      - "{route_args}"

    resume_args:
      - -p
      - --resume
      - "{session_id}"
      - --output-format
      - json
      - --model
      - "{model}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  # Safe route for Claude models such as Haiku that do not support
  # --permission-mode auto.
  claude-haiku:
    agent: claude
    model: haiku
    args: []

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
