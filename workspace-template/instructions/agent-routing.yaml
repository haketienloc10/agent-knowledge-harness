# Machine-readable interactive execution registry for qiqi_delegate.
# QiQi selects a route. The MCP server owns Herdr workspace/agent lifecycle,
# START/RESUME, native session identity, prompt/wait, and result artifact paths.
# Flags belong here, not in QiQi prompts or MCP tool arguments.
#
# `start_args` and `resume_args` are interactive agent arguments passed after
# `herdr agent start ... --`; they must not use non-interactive modes such as
# `codex exec` or `claude -p`.
#
# {route_args} expands to the selected route's args list. Scalar placeholders:
# {model}, {session_id}, {result_dir}.

version: 1

agents:
  codex:
    command: codex
    adapter: codex

    start_args:
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    # Codex's `-c` config overrides are top-level CLI options, so route args
    # intentionally precede the interactive `resume` subcommand.
    resume_args:
      - "{route_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"

  claude:
    command: claude
    adapter: claude

    start_args:
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    resume_args:
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  claude-haiku:
    agent: claude
    model: haiku
    args:
      - --permission-mode
      - acceptEdits
      - --effort
      - medium

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
