# Canonical machine-readable runtime routing registry for qiqi_delegate.
# This is the only file under instructions/ loaded by the MCP server.
#
# QiQi owns task semantics, route selection, and the START vs RESUME decision.
# This registry owns only agent executable/adapter, interactive START/RESUME argv,
# model selection, and route-specific native CLI flags.
# MCP owns Herdr workspace/agent lifecycle, native session identity, prompt/wait,
# result artifact lifecycle, validation, and cleanup.
#
# Flags belong here, not in QiQi prompts or MCP tool arguments.
# `start_args` and `resume_args` are interactive agent arguments passed after
# `herdr agent start ... --`; they must not use non-interactive execution modes.
#
# {route_args} expands to the selected route's args list. Scalar placeholders:
# {model}, {session_id}, {result_dir}.

version: 1

agents:
  codex:
    command: codex
    adapter: codex

    start_args:
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    # Codex's `-c` config overrides are top-level CLI options, so route args
    # intentionally precede the interactive `resume` subcommand.
    resume_args:
      - "{route_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"

  claude:
    command: claude
    adapter: claude

    start_args:
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    resume_args:
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  claude-haiku:
    agent: claude
    model: haiku
    args:
      - --permission-mode
      - acceptEdits
      - --effort
      - medium

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
