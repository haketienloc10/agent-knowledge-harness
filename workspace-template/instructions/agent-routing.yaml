# Machine-readable execution registry for qiqi_delegate.
# Fill every {{...}} placeholder during workspace setup.
#
# QiQi selects a route. The MCP server owns CLI construction, START/RESUME,
# native session-id extraction, result normalization and serialization.
# Flags belong here, not in QiQi prompts or MCP tool arguments.
#
# Agent-level args must be valid for every model using that agent. Put flags
# whose support varies by model (for example Claude permission modes) in the
# route's args instead.

version: 1

agents:
  codex:
    command: codex
    adapter: codex
    prompt_transport: stdin
    prompt_arg: "-"

    # {route_args} expands to the selected route's args list.
    # Other supported placeholders: {model}, {session_id}, {schema_path},
    # {result_path}.
    start_args:
      - exec
      - --yolo
      - --json
      - --ignore-user-config
      - -c
      - mcp_servers.qiqi_delegate.enabled=false
      - --model
      - "{model}"
      - "{route_args}"
      - --output-schema
      - "{schema_path}"
      - --output-last-message
      - "{result_path}"

    resume_args:
      - exec
      - --yolo
      - --json
      - --ignore-user-config
      - -c
      - mcp_servers.qiqi_delegate.enabled=false
      - --model
      - "{model}"
      - "{route_args}"
      - --output-schema
      - "{schema_path}"
      - --output-last-message
      - "{result_path}"
      - resume
      - "{session_id}"

  claude:
    command: claude
    adapter: claude
    prompt_transport: argument

    start_args:
      - -p
      - --output-format
      - json
      - --model
      - "{model}"
      - "{route_args}"

    resume_args:
      - -p
      - --resume
      - "{session_id}"
      - --output-format
      - json
      - --model
      - "{model}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: "{{CODEX_MODEL_ID}}"
    args:
      - -c
      - 'model_reasoning_effort="{{CODEX_REASONING_EFFORT}}"'

  # Safe route for Claude models such as Haiku that do not support
  # --permission-mode auto.
  claude-haiku:
    agent: claude
    model: "{{CLAUDE_HAIKU_MODEL_ID}}"
    args: []

  # Use this shape only for Claude models confirmed to support auto permission
  # mode (for example Sonnet 5+ in the target environment).
  claude-auto:
    agent: claude
    model: "{{CLAUDE_AUTO_MODEL_ID}}"
    args:
      - --permission-mode
      - auto
