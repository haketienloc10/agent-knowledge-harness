# Canonical machine-readable runtime routing registry for qiqi_delegate.
# QiQi owns task semantics, route selection and START/RESUME.
# qiqi_delegate owns native result capture/handoff injection.
# QIQI_WORK_ITEMS_DIR is a delegated-runtime mount alias initialized by
# scripts/qiqi-mcp-server.sh. Parent-side Work Item writes resolve
# <workspace>/work-items directly and do not depend on this child-process env.

version: 2

agents:
  codex:
    command: codex
    adapter: codex

    # qiqi_delegate maps the shared filesystem capability to native --add-dir.
    filesystem:
      additional_dirs:
        - env: QIQI_WORK_ITEMS_DIR
          required: true

    start_args:
      - "{handoff_args}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - "{route_args}"

    resume_args:
      - "{route_args}"
      - "{handoff_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"

  claude:
    command: claude
    adapter: claude

    # qiqi_delegate maps the shared filesystem capability to native --add-dir.
    filesystem:
      additional_dirs:
        - env: QIQI_WORK_ITEMS_DIR
          required: true

    start_args:
      - "{handoff_args}"
      - --model
      - "{model}"
      - "{route_args}"

    resume_args:
      - "{handoff_args}"
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - "{route_args}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.6-luna
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  claude-fast:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - low

  claude-balanced:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - medium

  claude-deep:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - high

  claude-verifier:
    agent: claude
    model: sonnet
    args:
      - --permission-mode
      - auto
      - --effort
      - xhigh
