# DOCUMENTATION-ONLY EXAMPLE. Canonical runtime registry is instructions/agent-routing.yaml.
version: 2

agents:
  claude:
    command: claude
    adapter: claude
    filesystem:
      additional_dirs:
        - env: QIQI_WORK_ITEMS_DIR
          required: true
    start_args:
      - "{handoff_args}"
      - --model
      - "{model}"
      - "{route_args}"
    resume_args:
      - "{handoff_args}"
      - --resume
      - "{session_id}"
      - --model
      - "{model}"
      - "{route_args}"

routes:
  claude-fast:
    agent: claude
    model: sonnet
    args: [--permission-mode, auto, --effort, low]
  claude-balanced:
    agent: claude
    model: sonnet
    args: [--permission-mode, auto, --effort, medium]
  claude-deep:
    agent: claude
    model: sonnet
    args: [--permission-mode, auto, --effort, high]
  claude-verifier:
    agent: claude
    model: sonnet
    args: [--permission-mode, auto, --effort, xhigh]
