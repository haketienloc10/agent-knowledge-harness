# DOCUMENTATION-ONLY EXAMPLE.
# qiqi_delegate does NOT load this file.
# To use any route below, copy/adapt it into instructions/agent-routing.yaml,
# which is the canonical runtime registry.
#
# Example registry for a Codex-only qiqi_delegate setup.
version: 1

agents:
  codex:
    command: codex
    adapter: codex

    start_args:
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"
      - "{route_args}"

    # Codex top-level config overrides must precede interactive resume.
    resume_args:
      - "{route_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - --add-dir
      - "{result_dir}"

routes:
  codex-fast:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="low"'

  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'

  codex-deep:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="high"'

  codex-verifier:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="xhigh"'
