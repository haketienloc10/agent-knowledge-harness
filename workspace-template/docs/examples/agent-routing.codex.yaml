# DOCUMENTATION-ONLY EXAMPLE. Canonical runtime registry is instructions/agent-routing.yaml.
version: 2

agents:
  codex:
    command: codex
    adapter: codex
    filesystem:
      additional_dirs:
        - env: QIQI_WORK_ITEMS_DIR
          required: true
    start_args:
      - "{handoff_args}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - "{route_args}"
    resume_args:
      - "{route_args}"
      - "{handoff_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'
