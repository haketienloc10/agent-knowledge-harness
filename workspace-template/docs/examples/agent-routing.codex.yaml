# DOCUMENTATION-ONLY EXAMPLE.
# Canonical runtime registry is instructions/agent-routing.yaml.
# qiqi_delegate does NOT load this file.
# Native result capture is MCP-owned; do not configure result paths or hook
# commands here.
#
# Example registry for a Codex-only qiqi_delegate setup. Keep this file
# structurally aligned with the canonical registry rather than maintaining a
# separate routing contract.
version: 2

agents:
  codex:
    command: codex
    adapter: codex

    start_args:
      - "{handoff_args}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"
      - "{route_args}"

    # Codex -c session config overrides are top-level options, so both
    # route_args and handoff_args intentionally precede the resume subcommand.
    resume_args:
      - "{route_args}"
      - "{handoff_args}"
      - resume
      - "{session_id}"
      - --dangerously-bypass-approvals-and-sandbox
      - --model
      - "{model}"

routes:
  codex-balanced:
    agent: codex
    model: gpt-5.4
    args:
      - -c
      - 'model_reasoning_effort="medium"'
