name: qiqi-delegate contract

on:
  pull_request:
    paths:
      - '.github/workflows/qiqi-delegate-contract.yml'
      - 'scripts/setup-workspace.sh'
      - 'workspace-template/identity.md'
      - 'workspace-template/.codex/config.toml'
      - 'workspace-template/.claude/**'
      - 'workspace-template/.qiqi/.gitignore'
      - 'workspace-template/README.md'
      - 'workspace-template/instructions/agent-routing.yaml'
      - 'workspace-template/instructions/model-routing.md'
      - 'workspace-template/docs/CLAUDE_CODE_SETUP.md'
      - 'workspace-template/docs/WORKSPACE_SETUP.md'
      - 'workspace-template/mcp/qiqi_delegate/**'
      - 'workspace-template/scripts/qiqi-mcp-server.sh'
      - 'workspace-template/scripts/setup-claude.sh'
      - 'workspace-template/scripts/workspace-check.sh'
      - 'work-item-template/**'
      - 'knowledge-template/**'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Sync qiqi_delegate MCP environment
        run: uv sync --project workspace-template/mcp/qiqi_delegate

      - name: Run qiqi_delegate unit and generated-schema tests
        run: >-
          uv run --project workspace-template/mcp/qiqi_delegate
          python -m unittest discover
          -s workspace-template/mcp/qiqi_delegate/tests -v

      - name: Run Work Item skill contract regression tests
        run: >-
          python -m unittest discover
          -s work-item-template/mcp/work_item/tests
          -p test_skill_contract.py -v

      - name: Check managed shell syntax
        run: |
          bash -n scripts/setup-workspace.sh
          bash -n workspace-template/scripts/qiqi-mcp-server.sh
          bash -n workspace-template/scripts/setup-claude.sh
          bash -n workspace-template/scripts/workspace-check.sh
          bash -n repo-template/scripts/repo-check.sh
          bash -n work-item-template/scripts/install-user-mcp.sh
          bash -n knowledge-template/scripts/install-user-mcp.sh
